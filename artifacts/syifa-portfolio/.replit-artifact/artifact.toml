kind = "web"
previewPath = "/"
title = "Syifa Sabrina Amalia — Portfolio"
description = "A business analysis and business intelligence portfolio for Syifa Sabrina Amalia, presenting all her data, cloud, and product design projects alongside volunteering and certificates."
version = "1.0.0"
id = "artifacts/syifa-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20056

[services.development]
run = "pnpm --filter @workspace/syifa-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/syifa-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/syifa-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20056"
BASE_PATH = "/"
